<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Card Embed</title>
  <link rel="stylesheet" href="bizly-flip.css" />
</head>
<body>
  <div class="card-wrapper">
    <!-- Card 1 -->
    <div class="container">
      <div class="scene">
        <div class="layer van van1"></div>
        <div class="layer logo"></div>
        <div class="layer van-back van-back1"></div>
        <div class="layer logo-back"></div>
        <div class="layer text-front">
          <p><strong>Party Bus:</strong><br />Fits 20–40 Passengers</p>
        </div>
        <div class="layer text-back">
          <p><strong>Don’t walk, Sprint</strong> to your next event with one of our 12 passenger vans.</p>
          <div class="button" onclick="window.open('https://lasvegaspartybus.com', '_blank')">BOOK NOW!</div>
        </div>
      </div>
    </div>
  </div>
  <script src="bizly-flip.js"></script>
</body>
</html>
